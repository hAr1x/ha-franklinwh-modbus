name: Full HACS Validation

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - 'custom_components/**'
      - 'hacs.json'
  pull_request:
    branches:
      - '*'
    paths:
      - 'custom_components/**'
      - 'hacs.json'

jobs:
  # Job 1: Runs immediately
  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  # Job 2: Runs immediately in parallel with Hassfest
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  # Job 3: Runs LAST using the corrected pip execution method
  linting:
    name: Code Linting (Ruff)
    runs-on: ubuntu-latest
    needs: [hassfest, hacs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check custom_components/
